[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-agent-bench"
version = "0.1.0"
description = "A causal benchmark for tool-using LLM agents under controlled interventions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "CausalAgentBench Contributors"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "rich>=13.0",
  "scipy>=1.10",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.7",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
causal-agent-bench = "causal_agent_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
