[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-agent-bench"
version = "0.1.0"
description = "Interventional benchmark for tool-using LLM agents — paired clean/intervention tasks, ACRS metrics, reproducible evaluation scaffold."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "CausalAgentBench Contributors"}
]
keywords = ["benchmark", "llm-agents", "causal-inference", "tool-use", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # jinja2 is required by pandas>=3.0 for DataFrame.to_latex (it now routes
  # through the Styler). Table export (analysis/tables.py) breaks without it on
  # pandas 3.x; pandas 2.x used a built-in formatter and pulled jinja2 in only
  # transitively, which masked the missing declaration. See CI Python matrix.
  "jinja2>=3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "rich>=13.0",
  "scipy>=1.10",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "codespell>=2.3",
  "hypothesis>=6.100",
  "matplotlib>=3.7",
  "mypy>=1.8",
  "nbformat>=5.10",
  "pre-commit>=3.5",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.5",
  "ruff>=0.5",
  "twine>=5.0",
]
docs = [
  "mkdocs-material>=9.5",
]

[project.scripts]
causal-agent-bench = "causal_agent_bench.cli:main"
cab = "causal_agent_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
causal_agent_bench = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" hosts the original causal_agent_bench package; "." hosts the new,
# isolated cab_vision (CVPR-direction) package at the repo root.
pythonpath = ["src", "."]
# Parallelize by default (pytest-xdist). The suite is parallel-safe (tmp_path
# isolation) and runs ~2.3x faster. For interactive debugging / pdb, override
# with `-n0` (e.g. `pytest -n0 -s tests/test_x.py::test_y`).
addopts = "-n auto"
markers = [
    "slow: long-running tests",
    "integration: integration tests (may start local benchmark runs)",
    "local_run: starts a local experiment via run_experiment (excluded from no-run validation)",
    "model: tests requiring model calls",
    "provider: tests requiring external providers",
    "build_phase: build-mode phase regression tests",
]

[tool.coverage.run]
source = ["causal_agent_bench"]
branch = true
parallel = true
omit = [
  "*/tests/*",
  "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
# Ratchet floor. Current total is ~76% (branch coverage on); raise this over
# time as coverage grows. Enforced by `make coverage` and the CI coverage job.
fail_under = 73
exclude_also = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  "\\.\\.\\.",
]

[tool.codespell]
# Spell-check prose + code, skipping generated artifacts, data, and binary/build
# outputs. `disjointness` (valid set-theory term) and `achiev` (an intentional regex
# prefix in scripts/audit_repo_consistency.py) are false positives; `nd` appears only
# in static-leakage test fixtures.
skip = "*.json,*.jsonl,*.csv,*.lock,*.log,*.ipynb,*.pdf,*.png,./.git,./data,./results,./reports,./paper/latexpaper,./.ruff_cache,./.pytest_cache,./.mutmut-cache,./mutants,./site,constraints.txt"
ignore-words-list = "disjointness,achiev,nd,covert"

[tool.mutmut]
# Mutation testing for the correctness-critical core (metrics + hashing). It runs
# the test suite against each generated mutant, so it is slow and opt-in (NOT a CI
# gate): `make mutate`. A surviving mutant means a behaviour no test pins down.
paths_to_mutate = "src/causal_agent_bench/metrics/,src/causal_agent_bench/hashing.py"
tests_dir = "tests/"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Expanded, curated rule set. Pyflakes/pycodestyle/isort/pyupgrade/bugbear
# (the original gate) plus comprehensions (C4), flake8-pie (PIE), return
# hygiene (RET), simplify (SIM), and Ruff's own rules (RUF).
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RET", "SIM", "RUF"]
ignore = [
  "E501",   # line length: not linter-enforced (no formatter is imposed on this tree)
  "SIM102", # collapsible nested `if`s — frequently clearer kept separate
  "RUF001", # ambiguous unicode in strings: intentional en dashes / ×, ≤ in reports & specs
  "RUF002", # ambiguous unicode in docstrings (same rationale)
  "RUF003", # ambiguous unicode in comments (same rationale)
  "RUF012", # mutable class defaults: tool/metric metadata dicts; ClassVar pass deferred
]

[tool.ruff.lint.per-file-ignores]
# Entry-point scripts bootstrap sys.path before importing the local package and
# sibling scripts, so module-level imports legitimately follow that statement.
"scripts/*" = ["E402"]

# Gate-by-default typing. mypy type-checks the WHOLE package; every module must
# pass unless it is explicitly exempted in the `ignore_errors` override below.
# This locks in the 101 modules that are already clean and forces any NEW module
# to type-check, rather than only gating a hand-picked allow-list. The override
# list is the remaining typing debt (mostly pandas `union-attr`) to whittle down
# over time. `py.typed` ships these annotations to downstream consumers (PEP 561).
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
follow_imports = "silent"
files = ["src/causal_agent_bench"]

# Typing debt — these modules still have findings, so their errors are
# suppressed to keep the gate green. Remove a module once it type-checks
# cleanly. Do NOT add modules here to silence new code; fix the types instead.
[[tool.mypy.overrides]]
ignore_errors = true
module = [
  # WIP feature modules under active development (governance / readiness / dashboard).
  # They use the same `_read_json(...).get(...)` union-attr pattern that has been
  # narrowed elsewhere; clean their types and remove them here once the feature settles.
  "causal_agent_bench.safety.evidence_dashboard",
  "causal_agent_bench.safety.governance_os",
  "causal_agent_bench.safety.readiness_war_room",
  "causal_agent_bench.agents.mock_behavior_agent",
  "causal_agent_bench.analysis.failure_gallery_doc",
  "causal_agent_bench.cli",
  "causal_agent_bench.environment",
  "causal_agent_bench.generation.interventions",
  "causal_agent_bench.metrics.base",
  "causal_agent_bench.phase2",
  "causal_agent_bench.safety.benchmark_quality",
  "causal_agent_bench.safety.config_metadata_lint",
  "causal_agent_bench.safety.config_profiles",
  "causal_agent_bench.safety.gold_output_validation",
  "causal_agent_bench.safety.intervention_isolation",
  "causal_agent_bench.safety.leakage_repair_applier",
  "causal_agent_bench.safety.leakage_repair_planner",
  "causal_agent_bench.safety.next_action_plan",
  "causal_agent_bench.safety.pair_link_validator",
  "causal_agent_bench.safety.provider_pilot_config_hardener",
  "causal_agent_bench.safety.provider_pilot_preflight",
  "causal_agent_bench.safety.release_blocker_analyzer",
  "causal_agent_bench.safety.report_quality_check",
  "causal_agent_bench.safety.run_cost_estimator",
  "causal_agent_bench.safety.static_leakage",
  "causal_agent_bench.safety.synthetic_fixtures",
  "causal_agent_bench.safety.tool_schema_validation",
]
