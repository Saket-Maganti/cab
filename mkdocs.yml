site_name: CausalAgentBench
site_description: >-
  Interventional benchmark for tool-using LLM agents — paired clean/intervention
  tasks, ACRS metrics, and a reproducible evaluation scaffold.
repo_url: https://github.com/Saket-Maganti/causal-agent-bench
docs_dir: docs
exclude_docs: |
  README.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite

# Curated entry points into the (large) docs/ tree. Files not listed here are still
# published; this is the primary navigation, not an exhaustive index.
nav:
  - Home: index.md
  - Quickstart: QUICKSTART.md
  - Benchmark:
      - Benchmark card: BENCHMARK_CARD.md
      - Dataset card: DATASET_CARD.md
      - Taxonomy: BENCHMARK_TAXONOMY.md
      - Interventions: INTERVENTIONS.md
      - Failure taxonomy: FAILURE_TAXONOMY.md
  - Metrics: METRICS.md
  - Reproducibility: REPRODUCIBILITY.md
  - CLI reference: CLI_REFERENCE.md
  - Research OS Level-5:
      - Quickstart: level5/QUICKSTART.md
      - Architecture: level5/CAB_RESEARCH_OS_ARCHITECTURE.md
      - Capability matrix: level5/CAB_LEVEL5_CAPABILITY_MATRIX.md
      - Benchmark factory: level5/BENCHMARK_FACTORY_SPEC.md
      - Execution OS: level5/EXECUTION_OS_ARCHITECTURE.md
      - Human review: level5/HUMAN_REVIEW_OS.md
      - Protected evaluator: level5/PROTECTED_EVALUATOR_ARCHITECTURE.md
      - Evidence graph: level5/EVIDENCE_GRAPH_SPEC.md
      - Governance: level5/GOVERNANCE_CHARTER.md
      - CLI: level5/CLI_REFERENCE.md
      - Troubleshooting: level5/TROUBLESHOOTING.md
      - Registry and migrations: level5/REGISTRY_AND_MIGRATIONS.md
      - Reliability operations: level5/RELIABILITY_OPERATIONS.md
      - Reproduction manual: level5/REPRODUCTION_MANUAL.md
      - Hardened operations tutorials: level5/HARDENING_TUTORIALS.md
      - Corrections, appeals, and retirement: level5/CORRECTIONS_APPEALS_AND_RETIREMENT.md
  - Policy:
      - Evidence levels: EVIDENCE_LEVEL_POLICY.md
      - Ethics & limitations: ETHICS_AND_LIMITATIONS.md
  - Glossary: GLOSSARY.md
