name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

env:
  MPLCONFIGDIR: /tmp/mpl
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  static:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check --output-format=github .

      - name: Type check (typed core)
        run: python -m mypy

      - name: Spell check
        run: codespell

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Keep going so one version's failure still reports the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        if: matrix.python-version != '3.11'
        run: python -m pytest -q

      - name: Unit tests (with coverage)
        if: matrix.python-version == '3.11'
        run: >-
          python -m pytest -q
          --cov=causal_agent_bench
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  gates:
    name: Release, paper & artifact gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Security check
        run: python scripts/security_check.py

      - name: Release check
        run: python scripts/release_check.py

      - name: Paper draft checks
        run: |
          python scripts/check_paper_placeholders.py --mode draft
          python scripts/check_bibliography.py --all-sections
          python scripts/check_reviewer_proofing.py
          python scripts/check_claim_ledger.py

      - name: Camera-ready precheck (draft)
        run: python scripts/camera_ready_precheck.py --mode draft --skip-release

      - name: Artifact precheck
        run: python scripts/reproduce_artifact.py --check

      - name: Smoke CLI
        run: |
          python -m causal_agent_bench --help
          python -m causal_agent_bench validate data/sample/instances.jsonl --schema instances

      - name: Artifact smoke step
        run: python scripts/reproduce_artifact.py --step smoke
        env:
          SKIP_ARTIFACT_SMOKE: "0"
