name: Max Ceiling Provider-Free Gates

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLCONFIGDIR: /tmp/mpl
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  # Explicitly empty provider credentials document and enforce the no-provider lane.
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  OPENROUTER_API_KEY: ""

jobs:
  provider-free-gates:
    name: Scorer, metrics, data, notebooks, claims & release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Provider-free correctness slice (serial fallback)
        run: make max-ceiling-tests-serial

      - name: Immutable split registry
        run: make split-registry-check

      - name: Nine-notebook offline fixture execution
        run: make kaggle-fixture-check

      - name: Security, claim, and release gates
        run: |
          python scripts/security_check.py
          python scripts/check_claim_ledger.py --mode draft
          python scripts/release_check.py
