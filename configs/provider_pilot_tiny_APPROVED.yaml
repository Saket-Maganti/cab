seed: 20270550
run_name: provider_pilot_tiny_APPROVED
benchmark_path: data/processed/pilot_v0_1/pilot_20_instances.jsonl
provider_registry_path: configs/providers.yaml
pricing_registry_path: configs/model_pricing.yaml

template_only: false
scientific_evidence: false
scientific_evidence_level: preliminary_or_engineering
evidence_scope: provider_pilot_debug_or_preliminary
provider_type: default
require_dry_run_before_live: true

allow_paid_calls: false
cost_mode: default

max_instances: 5
limits:
  max_instances: 5
  max_agents: 1
  max_trajectories: 5
  stop_after_trajectories: 5
  max_runtime_minutes: 30
  max_steps_per_instance: 6
  max_output_tokens: 512
  max_api_calls: 30

budget_cap_usd: 5.0
task_budget_cap_usd: 0.75
budget:
  max_total_usd: 5.0
  max_calls: 30
  require_explicit_paid_approval: true
  strict_pricing: true

approval:
  advisor_approved: true
  budget_approved: true
  approved_for_dry_run: true
  approved_for_live_run: false
  approved_by: "Saket Maganti"
  approval_date: "2026-06-12"
  advisor_approval_id: "SELF-AUTHORIZATION-TINY-PROVIDER-PILOT"
  max_budget_usd: 5.0
  notes: "Self-authorized dry-run/preflight only; live provider calls, paid calls, claim promotion, and paper asset eligibility are not approved."

agent_runs:
  - name: direct_tool_provider_pilot
    agent: direct_tool_agent
    provider: openai
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 512
    retry_count: 2
    timeout: 60
    budget_cap_usd: 5.0
    extra:
      api_version: openai-chat-completions-v1
      input_tokens_per_call_estimate: 1200

max_steps: 6
num_repeats: 1
output_dir: results
save_observations: true
save_agent_thoughts: true
fail_fast: true
auto_score: true
