schema_version: cab_raac_policy_v1
name: raac_full
evidence_class: DESIGN_ONLY
scientific_evidence: false
paper_eligible: false
raac:
  enabled: true
  variant: RAAC_FULL
  comparison_mode: practical_budget
  equal_budget_contract: null
  evidence_class: EXECUTION_PENDING
  observable_signals_only: true
  checkpoint_every_decision: 1
declared_compute_contract:
  max_extra_model_calls: 8
  max_extra_tool_calls: 6
  max_retries: 2
  max_alternate_routes: 2
  max_verification_steps: 3
  max_clarification_steps: 1
  token_budget: 1536
  wall_clock_budget_seconds: 90.0
termination_rule: >-
  Resolve observable anomalies within all declared ceilings, then answer,
  qualify, abstain, or terminate on infrastructure failure.
