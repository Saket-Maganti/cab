seed: 2027
run_name: pilot_multi_provider_20
allow_paid_calls: false
benchmark_path: data/processed/pilot_v0_1/pilot_20_instances.jsonl
provider_registry_path: configs/providers.yaml
pricing_registry_path: configs/model_pricing.yaml
budget:
  max_total_usd: 75.0
  max_calls: 2880
  max_input_tokens: 6000000
  max_output_tokens: 2500000
  require_explicit_paid_approval: true
  strict_pricing: true
task_budget_cap_usd: 2.0
agent_runs:
  - name: direct_tool_openai
    agent: direct_tool_agent
    provider: openai
    model: "${OPENAI_MODEL_ID:-}"
    temperature: 0.0
    max_tokens: 700
    retry_count: 2
    timeout: 60
    budget_cap_usd: 25.0
    max_api_calls: 960
    extra:
      prompt_file: direct_tool_agent.md
      prompt_version: v1
      api_version: openai-chat-completions-v1
      input_tokens_per_call_estimate: 1800
  - name: planner_executor_anthropic
    agent: planner_executor_agent
    provider: anthropic
    model: "${ANTHROPIC_MODEL_ID:-}"
    temperature: 0.0
    max_tokens: 900
    retry_count: 2
    timeout: 60
    budget_cap_usd: 25.0
    max_api_calls: 960
    extra:
      prompt_file: planner_executor_agent.md
      prompt_version: v1
      api_version: anthropic-messages-v1
      input_tokens_per_call_estimate: 2200
  - name: self_check_openrouter
    agent: self_check_agent
    provider: openrouter
    model: "${OPENROUTER_MODEL_ID:-}"
    temperature: 0.0
    max_tokens: 900
    retry_count: 2
    timeout: 60
    budget_cap_usd: 25.0
    max_api_calls: 960
    extra:
      prompt_file: self_check_agent.md
      prompt_version: v1
      api_version: openrouter-chat-completions-v1
      input_tokens_per_call_estimate: 2200
max_steps: 8
num_repeats: 1
output_dir: results
save_observations: true
save_agent_thoughts: true
fail_fast: false
auto_score: true
